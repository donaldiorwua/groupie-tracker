<!DOCTYPE html>
<html>

<head>
    <title>Groupie Tracker</title>
</head>

<body>
    <h1>Groupie Tracker</h1>
    <p>Welcome to the artists page!</p>

    {{ range . }}
    <div>
        <h2>Artists Name: <a href="/artist?id={{ .ID}}"> {{ .Name }}</a></h2>
    </div>
    <img src="{{ .Image }}" alt="{{ .Name }}">
    <p>ID: {{ .ID}}</p>
    <p>Creation Year: {{ .CreationYear}}</p>
    <p>First Album Year: {{ .FirstAlbum}} </p>
    <p> Members:</p>
    <ul>
        {{ range .Members }}
        <li>{{ . }}</li>
        {{end}}
    </ul>
    {{ end }}
</body>

</html>
